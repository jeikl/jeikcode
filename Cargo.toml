[workspace]
resolver = "2"
# Glob picks up the closed-source `atomcode-codingplan-crypto` overlay
# the official build pipeline drops into `crates/` (see the stub at
# `crates/atomcode-codingplan-crypto/`). Adding any future crate is also
# a no-toml-edit operation.
members = ["crates/*"]
# `atomcode-codingplan-crypto` is intentionally absent from default-members:
# the stub is wired into atomcode-auth via an optional dep behind the
# final binary's `codingplan-crypto` feature, so a default `cargo build`
# from the workspace root has no reason to compile it. The official build
# picks it up explicitly via `--features atomcode/codingplan-crypto`.
default-members = [
    "crates/atomcode-cli",
    "crates/atomcode-daemon",
    "crates/atomcode-telemetry",
    "crates/atomcode-tuix",
]

[profile.release]
opt-level = 2
lto = false
codegen-units = 4
strip = true
# Cargo 默认 release 关增量，所以「只改几行 Rust」也会把整个成品重链 7–8 分钟。
# 打开后 target/release 可复用；官方 CI 若要可复现、无增量缓存，设 CARGO_INCREMENTAL=0。
incremental = true

[profile.test]
debug = "line-tables-only" # Smaller binaries, faster linker

# Full-product debugging (the `jeikcode` / `atomcode` binary), not unit tests.
#   cargo build -p atomcode --bin jeikcode --profile dbg
# Output: target/dbg/jeikcode  (Windows: target/dbg/jeikcode.exe)
#
# Isolated from `target/debug` (tests) and `target/release` (stripped).
# debug=1 = line tables + function/var names, not debug=2's huge DWARF.
# opt-level=1 keeps `jeikcode init` usable; opt-0 makes a 15k-file index crawl.
[profile.dbg]
inherits = "release"
opt-level = 1
debug = 1
strip = false
lto = false
incremental = true
codegen-units = 16

[workspace.package]
version = "6.0.48"
edition = "2021"
license = "MIT"
repository = "https://github.com/jeikl/jeikcode"
description = "Open-source terminal AI coding agent"

[workspace.dependencies]
agent-client-protocol = "=1.0.1"
anyhow = "1"
similar = "2"
