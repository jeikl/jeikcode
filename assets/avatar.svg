<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Brand Glow Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48" />
    </filter>
  </defs>

  <!-- Base Icon Canvas with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Background Light Bloom -->
  <circle cx="256" cy="240" r="130" fill="#38bdf8" opacity="0.12" filter="url(#ambientGlow)" />
  <circle cx="280" cy="280" r="120" fill="#a855f7" opacity="0.12" filter="url(#ambientGlow)" />

  <!-- Geometric Circuit Grid Accent Lines -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8">
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
  </g>

  <!-- Central Emblem: Stylized Futuristic 'J' + Code Quantum Node -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Header Bar -->
    <path d="M190 148 L322 148 C332 148 340 156 340 166 L340 178 C340 188 332 196 322 196 L278 196 L278 290 C278 336 242 372 196 372 C150 372 118 336 118 300 C118 288 128 278 140 278 C152 278 162 288 162 300 C162 316 176 328 196 328 C216 328 234 312 234 290 L234 196 L190 196 C180 196 172 188 172 178 L172 166 C172 156 180 148 190 148 Z" 
          fill="url(#brandGrad)" />

    <!-- Left Code Bracket Accent < -->
    <path d="M142 214 L98 256 L142 298" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Code Bracket Accent > -->
    <path d="M370 214 L414 256 L370 298" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Quantum Energy Spark Dot (Top Right) -->
    <circle cx="376" cy="148" r="14" fill="#00f2fe" />
    <circle cx="376" cy="148" r="24" fill="#00f2fe" opacity="0.4" />
  </g>
</svg>
