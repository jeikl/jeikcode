[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomcode-sdk"
version = "0.1.0"
description = "Python SDK for AtomCode serve OpenAI/Anthropic-compatible streaming APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AtomCode" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["atomcode_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
