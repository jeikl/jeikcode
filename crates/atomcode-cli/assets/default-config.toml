# JeikCode default config (new-install template).
# Model / provider / account tables are empty here — fill them via /provider
# or keep your own [models] / [provider_accounts] on upgrade merge.

language = "zh-CN"
auto_update = false
auto_commit = false
keep_interrupted_context = true
offline_mode = "off"

[subagent]
# Live knobs: max_concurrent / max_rounds. enabled / initial_turns / max_turns /
# timeout_secs are kept only so old config files still parse.
max_concurrent = 3
max_rounds = 200

[loop_config]
max_rounds = 100

[coding]
max_rounds = 200
first_token_timeout_secs = 60
first_token_timeout_retries = 3

[tools.todo]
enabled = true
eager = "auto"

[tools.bash]
# Shared hard lifetime for every tool that waits on a spawned command
# (bash, ast_grep, git clone, web_fetch curl fallback, parallel_edit build probe).
# Agent bash has no timeout argument. default_timeout is !cmd only.
# silent_kill_secs: short-command idle kill for agent bash AND !cmd
# (no new stdout/stderr for this long → kill tree, keep captured output).
# Compile/test/install families skip idle and wait on max_timeout_secs. 0 disables.
default_timeout_secs = 120
max_timeout_secs = 1800
silent_kill_secs = 60

[tools.timeouts]
# Short budgets — not the spawned-command hard lifetime above.
# Values are Grok-like categories, ~20% more lenient than Grok (keep longer
# ones that already exceed that, e.g. MCP 180 > Grok 60s).
search_secs = 72          # grep / glob walk (Grok WSL 60s +20%)
web_connect_secs = 12     # HTTP connect (web_fetch); Grok 10s +20%
web_request_secs = 72     # web_fetch idle / web_search request; Grok 60s +20%
mcp_secs = 180            # MCP tool-call default when mcp.json omits timeout_ms
skill_cmd_secs = 40       # skill template !`cmd`
hook_secs = 30            # CC hook default + ceiling (Grok observe default 5s)
fs_gate_secs = 36         # hung NFS canonicalize; Grok 30s +20%

[tools.tool_output]
max_bytes = 65536
no_fold_tools = [
    "fetch_output",
    "repo_map",
    "code_explore",
    "web_fetch",
    "web_search",
]

[ui]
theme = "auto"
auto_copy_on_select = false
auto_copy_code_blocks = false
ai_session_naming = true
terminal_status_glyph = true
truncate_resumed_history = true

[plugin]
auto_install_default_skills = true
auto_update_marketplaces = true

[web_search]
provider = "exa"

[datalog]
enabled = true
dir = "~/.atomcode/datalog"

[notifications]
enabled = true
min_duration_secs = 8
terminal = true
system = true
bell = true
background_only = true

[network.proxy]
mode = "follow_system"
