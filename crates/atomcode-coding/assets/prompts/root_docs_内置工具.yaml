# root_docs_内置工具.yaml
# 本文档不加载进模型。仅供人类阅读。
# 运行时工具 schema 来自 Rust `Tool::description()` / `parameters_schema()`。
# ==============================================================================
# AtomCode 内置工具说明（种子文档）
# 已按用户需求裁剪：移除了未启用的细粒度 CodeIntel 衍生工具与 AtomGit 平台工具，
# 仅保留真实挂载且高频的核心工具。修改本文件不会改变线上 tools 列表。
# 【提示】：每个参数均包含精准的【中文翻译】与【作用说明】注释。
# ==============================================================================

version: "2.0.0"

tools:
  # ============================================================================
  # 一、核心文件与系统操作 (Filesystem & Shell)
  # ============================================================================
  - name: "read_file"
    category: "filesystem"
    # 【中文】：读取指定文件的内容并返回带行号的内容（格式为 '<line_number>→<content>'），支持通过 offset 和 limit 截取指定行范围。用于读取文件内容或代码上下文。
    description: "Read file contents with line-number prefix formatted as '<line_number>→<content>', with support for offset and limit. Use to read file contents and code context."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：待读取的目标文件路径。
        description: "Path to the file to read."
      offset:
        type: "integer"
        required: false
        default: 1
        # 【中文】：起始行号（从 1 开始）。仅在文件过大分页时提供。
        description: "Start line, 1-based. Provide only when paginating."
      limit:
        type: "integer"
        required: false
        # 【中文】：读取行数。仅在文件过大分页时提供。
        description: "Number of lines to read. Provide only when paginating."
    guidance: "Use read_file instead of `bash cat`."

  - name: "write_file"
    category: "filesystem"
    # 【中文】：向文件写入完整内容，若文件不存在则自动创建所需父目录。必须先使用 read_file 读取文件内容后再写入。用于创建全新文件或完全覆写现有文件，局部修改是不支持的。
    description: "Write full content to a file, automatically creating parent directories if absent. Read the file with `read_file` before writing. Use for creating new files or fully replacing existing files; partial modifications are not supported."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：目标文件路径。
        description: "Target file path to write."
      content:
        type: "string"
        required: true
        # 【中文】：写入文件的完整内容。
        description: "Full content to write."
    guidance: "Use write_file for new files or full rewrites; use edit_file for targeted edits."

  - name: "edit_file"
    category: "filesystem"
    # 【中文】：通过精确字符串匹配替换现有文件中的代码片段。修改前请先使用 read_file 获取精确内容。用于局部修改文件内容。
    description: "Perform exact string replacements in existing files. Read the file with `read_file` before editing. Use for partial file modifications."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：要修改的文件路径（支持 path 别名）
        description: "Path of the file to edit."
      edits:
        type: "array"
        required: true
        # 【中文】：填入每一处需要修改的数组对象
        description: "Series of edits to apply in sequence."
        items:
          old_string:
            type: "string"
            required: true
            # 【中文】：待查找替换的原代码片段
            description: "Exact text to find and replace."
          new_string:
            type: "string"
            required: true
            # 【中文】：替换后的新代码片段
            description: "Replacement text."
          replace_all:
            type: "boolean"
            required: false
            default: false
            # 【中文】：是否替换文件中所有匹配项（默认 false）
            description: "Replace all occurrences of old_string (default false)."
    guidance: "Read file with read_file first. Ensure old_string is unique or set replace_all=true. Same file: one edits array. Other files: parallel edit_file."

  - name: "list_directory"
    category: "filesystem"
    # 【中文】：列出指定目录下的直接子文件与子目录，自动忽略 .gitignore 中的条目。用于检查已知目录的下一层结构。查看宏观项目布局时配合 repo_map 使用。
    description: "List immediate files and subdirectories in a directory, automatically ignoring `.gitignore` entries. Use to inspect the direct children of a known directory. Pair with `repo_map` when viewing overall project layout."
    parameters:
      target_directory:
        type: "string"
        required: false
        default: "."
        # 【中文】：待列出的目录路径。
        description: "Directory to list (default: working directory)."
      depth:
        type: "integer"
        required: false
        default: 1
        # 【中文】：递归遍历的最大深度。
        description: "Recursion depth (default 1, max 6)."

  - name: "glob"
    category: "filesystem"
    # 【中文】：跨目录按通配符模式匹配文件路径。用于按文件名、扩展名或路径模式查找文件位置。通过文件名寻找符号定义时配合 grep 或 code_explore 使用。
    description: "Match file paths across directories using glob patterns. Use to find file locations by name, extension, or path pattern. Pair with `grep` or `code_explore` when locating symbol definitions by filename."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：通配符模式。
        description: "Glob pattern."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：匹配范围目录。
        description: "Directory scope to match."
      limit:
        type: "integer"
        required: false
        default: 300
        # 【中文】：最多返回的文件路径数量。
        description: "Maximum paths to return."

  - name: "global_search_replace"
    category: "filesystem"
    # 【中文】：在指定目录或工作区下，跨文件批量查找并替换所有匹配的文本。支持正则捕获组。修改前请先充分检索。用于大规模重构与跨文件重命名。
    description: "Search and batch-replace text across matching files in a directory or workspace, supporting regex capture groups. Thoroughly search before modifying. Use for large-scale refactoring and project-wide renames."
    parameters:
      search:
        type: "string"
        required: true
        # 【中文】：待查找的纯文本或正则表达式。
        description: "Text or regex pattern to find."
      replace:
        type: "string"
        required: true
        # 【中文】：替换文本（正则模式支持 $1、$2 引用捕获组）。
        description: "Replacement text (use $1, $2 for regex captures)."
      glob:
        type: "string"
        required: false
        # 【中文】：限定文件范围的通配符（如 *.rs, src/**/*.ts）。
        description: "File pattern to limit scope (e.g. *.rs, src/**/*.ts)."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：搜素和替换的目录范围。
        description: "Directory scope for search and replace."
      regex:
        type: "boolean"
        required: false
        default: false
        # 【中文】：是否启用正则匹配。
        description: "Use regex matching."

  - name: "grep"
    category: "filesystem"
    # 【中文】：使用正则或纯文本在文件中搜索内容，支持上下文行输出、忽略大小写与文件过滤。用于查找错误日志、精确文本片段或符号名。探索代码调用关系时请使用 code_explore。
    description: "Search file contents by regular expression or literal text, supporting context lines, case-insensitivity, and glob filtering. Use to find error messages, exact text snippets, or symbol names. Use `code_explore` when tracing call relationships."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：搜索文本或正则表达式。
        description: "Regex pattern or exact text to search for."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：搜索目录或文件。
        description: "Directory or file to search (default: working directory)."
      glob:
        type: "string"
        required: false
        # 【中文】：文件通配过滤（如 `*.rs`）。
        description: "File glob pattern to restrict search (e.g. '*.rs', '*.{ts,tsx}')."
      case_insensitive:
        type: "boolean"
        required: false
        default: false
        # 【中文】：是否忽略大小写（默认 false）。
        description: "Case-insensitive matching (default: false)."
      max_results:
        type: "integer"
        required: false
        default: 200
        # 【中文】：最大匹配行数。
        description: "Maximum matching lines to return (default: 200)."
      context:
        type: "integer"
        required: false
        default: 0
        # 【中文】：匹配行附带的上下文行数。
        description: "Lines of context before and after each match (default: 0, max: 10)."

  - name: "open_file"
    category: "filesystem"
    # 【中文】：在系统默认程序中打开文件、目录或网址。用户明确要求预览内容、查看目录或任务过程中需要启动外部程序时使用。
    description: "Open a file, directory, or URL in the default system application. Use when the user explicitly requests previewing content, opening a directory, or launching an external application during a task."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：目标文件路径。
        description: "Path to open."

  - name: "bash"
    category: "system"
    # 【中文】：在工作目录下执行终端命令并返回标准输出、标准错误和退出码。用于编译构建、测试、包管理、Git 操作、运行二进制与检查进程状态。不支持使用 && 串联多条命令（请使用分号 ; 隔开）。不可在此工具中调用 read_file、grep、glob、list_directory 等文件工具。此终端不具备键盘交互输入，不支持分页器、REPL、tail -f 及需要按键确认的命令。
    description: "Execute a shell command and return stdout, stderr, and exit code. Use for builds, tests, package management, Git operations, binaries, and process checks. Chaining commands with `&&` is not supported; use `;` instead. `read_file`, `grep`, `glob`, `list_directory`, `ls`, `head`, `tail`, `sed`, `awk`, and `find` are not available in this shell tool. Shell pipelines and aggregation (such as wc, sort, uniq, git log) are supported. This shell has no keyboard input; pagers, REPLs, `tail -f`, and commands requiring keyboard interaction are not supported."
    parameters:
      command:
        type: "string"
        required: true
        # 【中文】：执行的命令行指令。
        description: "Command string to run."
      shell:
        type: "string"
        required: false
        default: "default"
        # 【中文】：解释器：default | powershell | cmd。
        description: "Interpreter: default | powershell | cmd (Windows)."

  - name: "long_bash_keyword_actions"
    category: "system"
    # 【中文】：为长时间运行的命令注册或注销超时白名单关键字（如 cargo、npm、pytest），避免被视为空闲而终止。仅用于耗时较长的编译构建和测试命令。常驻服务或守护进程是不支持的。
    description: "Register or unregister timeout-whitelist keywords for long-running batch commands (such as `cargo`, `npm`, `pytest`) to avoid being terminated as idle. Use for lengthy compilation, builds, and test suites. Resident services and daemons are not supported."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["add", "delete"]
        # 【中文】：执行操作：add（添加关键字）、delete（删除关键字）
        description: "Action to perform: 'add' to register a keyword, 'delete' to remove it."
      keyword:
        type: "string"
        required: true
        # 【中文】：命令前缀关键字词元（例如 'mvn', 'cargo', 'ninja'）
        description: "Command keyword token (e.g. 'mvn', 'cargo', 'ninja')."
      global:
        type: "boolean"
        required: false
        default: false
        # 【中文】：是否全局持久化到 config.toml（默认 false，仅当前会话生效）
        description: "Persist in config.toml for all future sessions (default false, current session only)."

  - name: "bash_kill_by_id"
    category: "system"
    # 【中文】：通过命令 ID 强制终止后台正在运行的终端任务。用于终止无响应、超时挂起或不再需要的后台命令。
    description: "Terminate a background shell task by its command ID. Use to stop unresponsive, hung, or unneeded background processes."
    parameters:
      bashid:
        type: "string"
        required: true
        # 【中文】：后台运行中命令的唯一标识符（如 'b-...'）
        description: "The bashid of the running background bash command."

  # ============================================================================
  # 二、代码智能核心 (Code Intelligence - 默认挂载)
  # ============================================================================
  - name: "repo_map"
    category: "codeintel"
    # 【中文】：生成仓库目录树结构，支持 tree、full 和 symbols 输出模式。用于快速理解全局项目布局与模块层级。
    description: "Generate a repository directory tree structure, supporting `tree`, `full`, and `symbols` output modes. Use to quickly understand overall project layout and module hierarchy."
    parameters:
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：目标目录
        description: "Target directory."
      max_files:
        type: "integer"
        required: false
        default: 100
        # 【中文】：在 full 或 symbols 模式下提取并展示符号定义的最大文件数。
        description: "Maximum files to render symbols from in full or symbols mode (default: 100, max: 300)."
      mode:
        type: "string"
        required: false
        default: "tree"
        enum: ["tree", "full", "symbols"]
        # 【中文】：展示细节级别："tree"（纯目录结构树，默认）、"full"（目录树附带预算配额内的符号大纲）、"symbols"（仅输出符号大纲）。
        description: "Detail level: 'tree' (structure-only directory tree, default), 'full' (directory tree with budgeted symbol outlines), or 'symbols' (symbols only)."

  - name: "code_explore"
    category: "codeintel"
    # 【中文】：通过语义代码图谱检索代码调用关系与业务流转，支持中英文自然语言查询。用于顺藤摸瓜排查业务关键词、注释或符号在全库中的流转，以及追踪调用链路、变量引用和逻辑脉络。
    description: "Retrieve code call relationships and business flows using a semantic code graph, supporting natural-language queries in Chinese and English. Use to trace how business keywords, comments, or symbols operate across the codebase, as well as tracking call chains, variable references, and logic flows."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：搜索目标范围：支持工作区根目录 (".")、指定目录/模块、单个文件。
        description: "Scope path to search: workspace root ('.'), directory/module, or a specific file."
      query:
        type: "string"
        required: true
        # 【中文】：精确的符号名称或模糊的代码符号关键字，或中英文自然语言（如业务概念、领域术语、提问语句）。
        description: "Precise symbol name or fuzzy code symbol keyword, or natural language in Chinese or English (e.g. business concept, domain jargon, or question)."
      max_files:
        type: "integer"
        required: false
        default: 12
        maximum: 30
        # 【中文】：最多渲染源码片段的文件数量（默认 12，最大 30）
        description: "Maximum number of files to inspect (default: 12, max: 30)."
    guidance: "path can be the workspace root, a directory/module, or a target file; query is a symbol or Chinese/English keyword."

  # ============================================================================
  # 三、任务管理与交互 (Task & Interaction)
  # ============================================================================
  - name: "todowrite"
    category: "task"
    # 【中文】：为目标任务建立或维护结构化的多步骤清单，所有项完成后自动清空重置。用于规划任务、跟踪进度并提升交付质量。
    description: "Create or maintain a multi-step checklist for a task. Checklists are automatically cleared once all items are completed. Use to plan tasks, track progress, and improve delivery quality."
    parameters:
      actions:
        type: "array"
        required: true
        # 【中文】：填入每一项任务操作的数组对象
        description: "Array of task action objects to apply in sequence."
        items:
          action:
            type: "string"
            required: true
            enum: ["add", "insert", "update", "delete", "remove", "clear"]
            # 【中文】：操作类型：add（末尾追加）、insert（指定位置插入）、update（更新状态/内容）、delete/remove（删除任务）、clear（全量清空）
            description: "Action type: 'add', 'insert', 'update', 'delete', 'remove', or 'clear'."
          id:
            type: "integer"
            required: false
            # 【中文】：任务编号（从 1 开始；action 为 update、delete、remove 时必填；add、clear 时省略）
            description: "1-based task number (required for update, delete, remove; omit for add, clear)."
          position:
            type: "integer"
            required: false
            # 【中文】：插入位置（从 1 开始；仅 action 为 insert 时必填；其他操作省略）
            description: "1-based insert position (required for insert; omit for others)."
          status:
            type: "string"
            required: false
            enum: ["pending", "in_progress", "completed"]
            # 【中文】：任务状态（action 为 update 修改状态时必填；add 时选填，默认 pending；delete、clear 时省略）
            description: "Task status (required for update status change; optional for add, default pending; omit for delete, clear)."
          content:
            type: "string"
            required: false
            # 【中文】：任务描述文本（action 为 add、insert 时必填；update 改标题时选填；delete、clear 时省略）
            description: "Task description text (required for add, insert; optional for update title; omit for delete, clear)."

  - name: "request_user_input"
    category: "interaction"
    # 【中文】：弹出单选、多选或纯文本输入框以收集用户输入。用于信息不全、存在多种可行方案、缺失密钥/Token 或执行破坏性操作需用户确认时。向用户询问可自主决定的事项是不支持的。
    description: "Present a single-choice, multiple-choice, or text input prompt to collect user input. Use when information is insufficient, multiple approaches exist, secrets or tokens are needed, or destructive actions require confirmation. Inquiring about matters that can be determined autonomously is not supported."
    parameters:
      questions:
        type: "array"
        required: true
        # 【中文】：向用户展示的问题数组（1 到 4 个问题）
        description: "Array of 1 to 4 questions to present to the user."
        items:
          header:
            type: "string"
            required: true
            # 【中文】：分类标题（几个字）
            description: "Very short label (a few words)."
          question:
            type: "string"
            required: true
            # 【中文】：清晰提问单句
            description: "One clear sentence, ideally ending in '?'."
          mode:
            type: "string"
            required: true
            enum: ["single", "multiple", "text"]
            # 【中文】：交互模式：单选、多选或文本
            description: "Input mode: single, multiple, or text."
          options:
            type: "array"
            required: false
            # 【中文】：选项列表（单选/多选时提供；纯文本模式省略）
            description: "Choices for single/multiple; omit for text. JSON array of {label, description}."

  - name: "memory"
    category: "memory"
    # 【中文】：持久化存储用户跨会话的记忆事实、编码偏好或环境配置。当用户明确要求记住某个偏好、习惯、约定，或需要持久化重要上下文事实时触发。
    description: "Persist durable notes and preferences across sessions."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["remember", "forget", "list"]
      content:
        type: "string"
        required: false
        description: "Note content."

  - name: "task"
    category: "subagent"
    # 【中文】：派发子代理执行独立的子任务。explore 为只读探查，worker 可修改文件且必须声明 scope 限定写入范围。用于复杂探索和适合独立推进的并行任务。
    description: "Dispatch subagents to execute isolated subtasks. `explore` is read-only for research and findings; `worker` can edit files and must declare a `scope` to restrict write access. Use for complex exploration and parallel tasks that benefit from independent execution."
    parameters:
      tasks:
        type: "array"
        required: true
        description: "JSON array of subtasks."
        items:
          description:
            type: "string"
            required: true
          prompt:
            type: "string"
            required: true
          subagent_type:
            type: "string"
            required: true
            enum: ["explore", "worker"]
          scope:
            type: "array"
            required: false
            description: "Worker-only write globs, JSON string array (e.g. [\"src/auth/**\"]). Required for worker."

  - name: "code_review"
    category: "subagent"
    # 【中文】：对工作区或 Git 变更执行只读代码评审，按正确性、安全性、可靠性排序风险。用于合并前检查或提交前的自检。
    description: "Run a read-only review of workspace or Git changes, ranking risks by correctness, security, and reliability. Use for pre-merge inspection or pre-commit self-checks."
    parameters:
      scope:
        type: "string"
        required: false
        description: "Review target."

  - name: "fetch_output"
    category: "utility"
    # 【中文】：分片获取之前被截断的工具输出内容。用于前序工具输出末尾带有 artifact_id 截断标记时获取剩余内容。
    description: "Fetch remaining chunks of truncated tool output. Use when a previous tool result ends with an `artifact_id` truncation marker."
    parameters:
      artifact_id:
        type: "string"
        required: true
        description: "Artifact ID."

  - name: "jeikcode_config_guide"
    category: "utility"
    # 【中文】：查询 JeikCode 配置指南、目录布局与架构规范。用于用户询问如何配置模型、新增提供商、调整 reasoning effort、挂载 MCP、编写 Skill 或管理规则时。查询当前会话已挂载的 MCP 或技能是不支持的（已包含在当前上下文中）。
    description: "Query JeikCode configuration guides, directory layouts, and architecture specifications. Use when the user asks how to configure models, add providers, adjust reasoning effort, mount MCP servers, write skills, or manage rules. Querying currently mounted MCP servers or skills is not supported as they are already available in the context."
    parameters:
      topic:
        type: "string"
        required: false
        default: "overview"
        # 【中文】：待检索的主题分类
        description: "Category of configuration guide to retrieve: 'overview', 'prompts', 'models', 'providers', 'mcp', 'skills', 'thesaurus', 'tools', 'directories', 'project', 'updates', or 'all'."

  - name: "jeikcode_config_reload"
    category: "utility"
    # 【中文】：在当前会话中热重载配置而无需重启。用于修改并保存 ~/.atomcode 或项目目录下的配置文件（如 config.toml、mcp.json 等）后使其立即生效。
    description: "Hot-reload configuration in the active session without restarting. Use after modifying and saving configuration files (such as `config.toml` or `mcp.json`) under `~/.atomcode` or project directories."
    parameters:
      scope:
        type: "string"
        required: false
        enum: ["all", "mcp", "config"]
        # 【中文】：可选的作用域提示（'all', 'mcp', 'config'）
        description: "Optional scope hint ('all', 'mcp', 'config'). The runtime reloads config.toml, MCP, and skills together."

  # ============================================================================
  # 四、网络与技能 (Web & Skills)
  # ============================================================================
  - name: "web_fetch"
    category: "web"
    # 【中文】：通过 HTTP/HTTPS 抓取网页并提取转换为 Markdown 格式。用于获取用户提供链接的网页内容或查看网络搜索结果中的页面。
    description: "Fetch an HTTP/HTTPS webpage and convert its content to Markdown. Use to retrieve documentation or pages from user-provided URLs or search results."
    parameters:
      url:
        type: "string"
        required: true
        # 【中文】：待抓取的网页完整 URL 地址（须为 http 或 https 协议）
        description: "Fully-qualified HTTP or HTTPS URL to fetch."

  - name: "web_search"
    category: "web"
    # 【中文】：搜索互联网公开信息并返回标题、网址与摘要。用于查阅外部技术文档、第三方依赖问题或最新资讯。通过本地代码和文档可解决的问题，联网搜索是不支持的。
    description: "Search the web and return titles, URLs, and snippets. Use to consult technical documentation, external dependency issues, or recent information. Searching the web for issues resolvable via local code and docs is not supported."
    parameters:
      query:
        type: "string"
        required: true
        # 【中文】：搜索查询语句或关键词
        description: "Search query string."
      max_results:
        type: "integer"
        required: false
        default: 8
        # 【中文】：最大搜索返回条数（默认 8，最大 20）
        description: "Maximum number of search results to return (default: 8, max: 20)."

  - name: "use_skill"
    category: "skill"
    # 【中文】：执行已安装的指定技能。
    description: "Execute an installed skill by name."
    parameters:
      name:
        type: "string"
        required: true
        description: "Skill name from AVAILABLE SKILLS."

  - name: "list_skills"
    category: "skill"
    # 【中文】：列出已安装的全部技能。
    description: "List all installed skills."
    parameters: {}
