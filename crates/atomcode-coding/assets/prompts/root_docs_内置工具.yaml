# root_docs_内置工具.yaml
# 本文档不加载进模型。仅供人类阅读。
# 运行时工具 schema 来自 Rust `Tool::description()` / `parameters_schema()`。
# ==============================================================================
# AtomCode 内置工具说明（种子文档）
# 已按用户需求裁剪：移除了未启用的细粒度 CodeIntel 衍生工具与 AtomGit 平台工具，
# 仅保留真实挂载且高频的核心工具。修改本文件不会改变线上 tools 列表。
# 【提示】：每个参数均包含精准的【中文翻译】与【作用说明】注释。
# ==============================================================================

version: "2.0.0"

tools:
  # ============================================================================
  # 一、核心文件与系统操作 (Filesystem & Shell)
  # ============================================================================
  - name: "read_file"
    category: "filesystem"
    # 【中文】：读取指定文件内容，返回带行号的文本或图片数据。
    description: "Read file contents with line numbers. Supports images for vision models."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：目标文件路径
        description: "Path to the file to read."
      offset:
        type: "integer"
        required: false
        default: 1
        # 【中文】：起始行号（从 1 开始）
        description: "Starting line number (1-based)."
      limit:
        type: "integer"
        required: false
        # 【中文】：最大读取行数
        description: "The number of lines to read. Only provide if the file is too large to read at once."
    guidance: "Use read_file instead of `bash cat`."

  - name: "write_file"
    category: "filesystem"
    # 【中文】：创建新文件或完全重写现有文件。
    description: "Create a new file or completely overwrite an existing file."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：目标文件路径
        description: "Target file path to write."
      content:
        type: "string"
        required: true
        # 【中文】：完整文件内容
        description: "Full content to write."
    guidance: "Use write_file for new files or full rewrites; use edit_file for targeted edits."

  - name: "edit_file"
    category: "filesystem"
    # 【中文】：在现有文件中做局部替换。schema 只声明 JSON 数组；字符串化数组由后台静默解码。
    description: "Replace text in an existing file. Same-file multi-hunk uses a JSON-array `edits` field; independent files are parallel top-level calls."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：要修改的文件路径
        description: "Path of the file to edit."
      old_string:
        type: "string"
        required: false
        # 【中文】：单 hunk：待替换片段。用 `edits` 时省略。
        description: "Single-hunk text to find. Omit when using `edits`."
      new_string:
        type: "string"
        required: false
        # 【中文】：单 hunk：替换后的文本
        description: "Single-hunk replacement text. Omit when using `edits`."
      replace_all:
        type: "boolean"
        required: false
        default: false
        description: "Replace all occurrences (default false)."
      edits:
        type: "array"
        required: false
        # 【中文】：同一文件多 hunk。必须是 JSON 数组，不是字符串。内部按序串行，失败整笔回滚。
        description: "JSON array of {old_string,new_string} hunks. Applied serially on one buffer; one write."
        items:
          old_string:
            type: "string"
            required: false
            # 【中文】：定位用文本。缩进/空行/CRLF 差异由工具内部容忍，不必字节级复刻。
            description: "Snippet to replace. Indent / blank-line / CRLF-LF drift is tolerated."
          new_string:
            type: "string"
            required: false
            description: "Replacement snippet."
          replace_all:
            type: "boolean"
            required: false
            default: false
          start_line:
            type: "integer"
            required: false
            # 【中文】：上次 read 的 1-based 行号提示，不是硬切。有 old_string 时文本优先。
            description: "Optional 1-based hint from the last read. Not a hard splice when old_string is present."
          end_line:
            type: "integer"
            required: false
            description: "Optional 1-based hint. Range splice only when old_string is omitted."
      start_line:
        type: "integer"
        required: false
        description: "Optional 1-based hint (single-hunk). Same semantics as edits[].start_line."
      end_line:
        type: "integer"
        required: false
        description: "Optional 1-based hint (single-hunk)."
    guidance: "Prefer unique old_string. Same file: one edits array. Other files: parallel edit_file. Never sed/awk."

  - name: "list_directory"
    category: "filesystem"
    # 【中文】：对已知的一个目录做 ls（gitignore 感知）。不是工作区总览——总览用 repo_map，二者不要并行。
    description: "List one directory like ls (gitignore-aware). Not a workspace overview — that is repo_map. Do not pair the two."
    parameters:
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：要列出的那个目录（不是整仓）
        description: "Directory to list (one dir you already know, not the whole workspace)."
      depth:
        type: "integer"
        required: false
        default: 1
        # 【中文】：最大遍历深度。默认 1 = 本目录 + 直接子项。工作区树请用 repo_map。
        description: "Max recursion depth (default 1, max 6). Workspace tree → repo_map."

  - name: "glob"
    category: "filesystem"
    # 【中文】：按通配符模式查找匹配的文件。
    description: "Find files matching a glob pattern (e.g. `**/*.rs`)."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：通配符模式
        description: "Glob pattern to search for."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：搜索根目录
        description: "Root directory to search in."
      limit:
        type: "integer"
        required: false
        default: 300
        description: "Max paths to return (default 300, max 2000)."

  - name: "search_replace"
    category: "filesystem"
    # 【中文】：跨多文件批量查找替换。单文件请用 edit_file。
    description: "Find and replace across many files. For a single file, prefer edit_file."
    parameters:
      search:
        type: "string"
        required: true
      replace:
        type: "string"
        required: true
      glob:
        type: "string"
        required: false
      path:
        type: "string"
        required: false
      regex:
        type: "boolean"
        required: false
        default: false

  - name: "ast_grep"
    category: "filesystem"
    # 【中文】：按 AST 结构搜索。schema 的 paths 是 JSON 字符串数组；误传单个路径字符串时后台会包成一元数组。
    description: "Structural AST search via native ast-grep. paths is a JSON array of strings."
    parameters:
      pattern:
        type: "string"
        required: true
      paths:
        type: "array"
        required: false
        description: "Files/dirs/globs (JSON array). A single path may be sent as a string; the tool wraps it internally."
      lang:
        type: "string"
        required: false

  - name: "grep"
    category: "filesystem"
    # 【中文】：使用正则表达式在文件内容中搜索。
    description: "Search file contents across workspace with regex."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：搜索正则或关键词
        description: "Regex pattern or keyword to search for."
      path:
        type: "string"
        required: false
        # 【中文】：限定搜索的目录或文件
        description: "Subdirectory or file scope."
      glob:
        type: "string"
        required: false
        # 【中文】：文件过滤器（如 `*.rs`）
        description: "File filter pattern."
      max_results:
        type: "integer"
        required: false
        default: 200
        description: "Max matching lines (default 200)."
      context:
        type: "integer"
        required: false
        default: 0
        description: "Lines of context around each match (default 0, max 10)."
    guidance: "Smart-case: case-insensitive unless the pattern contains an uppercase letter. No case_insensitive flag."

  - name: "open_file"
    category: "filesystem"
    # 【中文】：在系统 GUI 默认程序中打开或预览文件。
    description: "Open/preview a local file in default system GUI."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：文件路径
        description: "Path to open."

  - name: "bash"
    category: "system"
    # 【中文】：在终端执行命令。不要传 timeout；空闲杀与硬上限由 [tools.bash] 控制。
    description: "Run a shell command. Do NOT pass timeout. Output streams live until exit, idle-kill, or max_timeout_secs."
    parameters:
      command:
        type: "string"
        required: true
        # 【中文】：命令行指令
        description: "Command string to run."
      shell:
        type: "string"
        required: false
        default: "default"
        # 【中文】：解释器。Windows 上 powershell / cmd；default 为 Git Bash 或 cmd。
        description: "Interpreter: default | powershell | cmd (Windows). Do not nest powershell -Command inside default."
    guidance: "Never use bash for file reads/writes. Never pass timeout."

  # ============================================================================
  # 二、代码智能核心 (Code Intelligence - 默认挂载)
  # ============================================================================
  - name: "repo_map"
    category: "codeintel"
    # 【中文】：生成索引支撑的完整代码库文件树与 AST 符号地图。
    description: "Generate complete, index-backed file tree and AST declaration map of the workspace."
    parameters:
      path:
        type: "string"
        required: false
        default: "."
        description: "Root path."
      max_depth:
        type: "integer"
        required: false
        default: 3
        description: "Max depth."

  - name: "code_explore"
    category: "codeintel"
    # 【中文核心工具】：全能代码探索与语义问答工具（核心主力工具，不仅用于架构探索！）。
    # 【使用技巧】：`path` 必须是目录/模块（crates/atomcode-coding、src/auth），禁止单个文件（那是 read_file）。
    # 在该目录下用 `query` 查精准符号名（CodeExploreTool）或自然中英文（鉴权怎么做 / how does X work）。
    # 例：path="crates/atomcode-coding" query="CodeExploreTool"；path="src/auth" query="用户登录如何校验"。
    # 工具会自动进行中英 NLP 语义分析、同义词扩展、AST 语法树调用链路追踪，并精准返回核心实现代码。
    description: "PRIMARY code-intelligence tool. path MUST be a directory/module (crates/atomcode-coding, src/auth), never a file. query is a precise symbol or natural Chinese/English."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：【必填】目录或模块（crates/atomcode-coding、src/auth）。禁止单个文件（src/auth.rs → read_file）。禁止 `.` / 工作区根（→ repo_map）。
        description: "REQUIRED directory or module (e.g. 'crates/atomcode-coding', 'src/auth'). NEVER a file ('src/auth.rs') — that is read_file. NEVER '.' — call repo_map first."
      query:
        type: "string"
        required: true
        # 【中文】：精准符号名（CodeExploreTool）或自然中英文（鉴权怎么做、how does session compaction work）。符号放 query，不要放 path。
        description: "Precise symbol name (CodeExploreTool) OR natural Chinese/English (鉴权怎么做, how does X work). Put the symbol here, not in path."
    guidance: "path is a directory/module after repo_map; query is a symbol or Chinese/English. Never pass a file as path. Never pass '.'."

  # ============================================================================
  # 三、任务管理与交互 (Task & Interaction)
  # ============================================================================
  - name: "todowrite"
    category: "task"
    # 【中文】：管理结构化多步骤任务清单。优先 actions 数组，不要把数组打成字符串。
    description: "Manage structured todo list (pending, in_progress, completed)."
    parameters:
      actions:
        type: "array"
        required: false
        description: "Preferred batch: add/insert/update/delete/clear objects. JSON array, not a string."
      action:
        type: "string"
        required: false
        description: "Single-action shorthand when not using actions[]."
      todos:
        type: "array"
        required: false
        description: "Legacy full-list replace only. Prefer clear + add in the same actions array."

  - name: "request_user_input"
    category: "interaction"
    # 【中文】：向用户弹出交互式提问。单题用 header/question/mode/options；多题用 questions 数组。
    description: "Ask the user structured question(s). Either top-level header/question/mode/options, or a questions array (max 4)."
    parameters:
      header:
        type: "string"
        required: false
      question:
        type: "string"
        required: false
      mode:
        type: "string"
        required: false
        enum: ["single", "multiple", "text"]
      options:
        type: "array"
        required: false
        description: "Choices for single/multiple; omit for text. JSON array."
      questions:
        type: "array"
        required: false
        description: "Up to 4 questions in one interaction. JSON array of the same objects."

  - name: "memory"
    category: "memory"
    # 【中文】：跨会话记录重要事实或偏好。
    description: "Persist durable notes and preferences across sessions."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["remember", "forget", "list"]
      content:
        type: "string"
        required: false
        description: "Note content."

  - name: "recall"
    category: "memory"
    # 【中文】：检索历史会话的上下文与决策。
    description: "Recall past session conversation context."
    parameters:
      query:
        type: "string"
        required: true
        description: "Search keywords."

  - name: "task"
    category: "subagent"
    # 【中文】：派生子代理。参数是 tasks 数组，不是顶层 subagent_type。
    description: "Spawn isolated subagents. Pass tasks:[{description,prompt,subagent_type,scope?}]. JSON array, not a string."
    parameters:
      tasks:
        type: "array"
        required: true
        description: "JSON array of subtasks."
        items:
          description:
            type: "string"
            required: true
          prompt:
            type: "string"
            required: true
          subagent_type:
            type: "string"
            required: true
            enum: ["explore", "worker"]
          scope:
            type: "array"
            required: false
            description: "Worker-only write globs, JSON string array (e.g. [\"src/auth/**\"]). Required for worker."

  - name: "code_review"
    category: "subagent"
    # 【中文】：运行代码评审子代理审查改动。
    description: "Run code review on staged or uncommitted changes."
    parameters:
      scope:
        type: "string"
        required: false
        description: "Review target."

  - name: "fetch_output"
    category: "utility"
    # 【中文】：取回之前被折叠的完整超长输出。
    description: "Fetch folded tool output by artifact ID."
    parameters:
      artifact_id:
        type: "string"
        required: true
        description: "Artifact ID."

  # ============================================================================
  # 四、网络与技能 (Web & Skills)
  # ============================================================================
  - name: "web_fetch"
    category: "web"
    # 【中文】：抓取网页并转为 Markdown。
    description: "Fetch webpage and convert to markdown."
    parameters:
      url:
        type: "string"
        required: true
        description: "URL to fetch."

  - name: "web_search"
    category: "web"
    # 【中文】：执行网络搜索。
    description: "Search the web for query."
    parameters:
      query:
        type: "string"
        required: true
        description: "Query string."

  - name: "use_skill"
    category: "skill"
    # 【中文】：执行已安装的指定技能。
    description: "Execute an installed skill by name."
    parameters:
      name:
        type: "string"
        required: true
        description: "Skill name from AVAILABLE SKILLS."

  - name: "list_skills"
    category: "skill"
    # 【中文】：列出已安装的全部技能。
    description: "List all installed skills."
    parameters: {}
