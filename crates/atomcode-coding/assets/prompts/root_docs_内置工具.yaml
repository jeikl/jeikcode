# root_docs_内置工具.yaml
# 本文档不加载进模型。仅供人类阅读。
# 运行时工具 schema 来自 Rust `Tool::description()` / `parameters_schema()`。
# ==============================================================================
# AtomCode 内置工具说明（种子文档）
# 已按用户需求裁剪：移除了未启用的细粒度 CodeIntel 衍生工具与 AtomGit 平台工具，
# 仅保留真实挂载且高频的核心工具。修改本文件不会改变线上 tools 列表。
# 【提示】：每个参数均包含精准的【中文翻译】与【作用说明】注释。
# ==============================================================================

version: "2.0.0"

tools:
  # ============================================================================
  # 一、核心文件与系统操作 (Filesystem & Shell)
  # ============================================================================
  - name: "read_file"
    category: "filesystem"
    # 【中文】：读取指定文件内容，返回带行号的文本或图片数据。
    description: "Read file contents with line numbers. Supports images for vision models."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：目标文件路径
        description: "Path to the file to read."
      offset:
        type: "integer"
        required: false
        default: 1
        # 【中文】：起始行号（从 1 开始）
        description: "Starting line number (1-based)."
      limit:
        type: "integer"
        required: false
        # 【中文】：最大读取行数
        description: "The number of lines to read. Only provide if the file is too large to read at once."
    guidance: "Use read_file instead of `bash cat`."

  - name: "write_file"
    category: "filesystem"
    # 【中文】：创建新文件或完全重写现有文件。
    description: "Create a new file or completely overwrite an existing file."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：目标文件路径
        description: "Target file path to write."
      content:
        type: "string"
        required: true
        # 【中文】：完整文件内容
        description: "Full content to write."
    guidance: "Use write_file for new files or full rewrites; use edit_file for targeted edits."

  - name: "edit_file"
    category: "filesystem"
    # 【中文】：在现有文件中执行高精度的局部字符串替换。
    description: "Perform precise string replacements in an existing file."
    parameters:
      file_path:
        type: "string"
        required: true
        # 【中文】：要修改的文件路径
        description: "Path of the file to edit."
      edits:
        type: "array"
        required: true
        # 【中文】：待应用的替换块列表
        description: "List of replacement blocks."
        items:
          old_string:
            type: "string"
            required: true
            # 【中文】：待替换的唯一原始代码片段（需包含精确前导空格）
            description: "Exact unique snippet in the file to replace, including indentation."
          new_string:
            type: "string"
            required: true
            # 【中文】：替换后的新代码片段
            description: "Replacement snippet."
          replace_all:
            type: "boolean"
            required: false
            default: false
            # 【中文】：是否替换所有匹配项
            description: "Replace all occurrences."
    guidance: "Include enough context in old_string to be unique. Never use shell sed/awk to edit code."

  - name: "list_directory"
    category: "filesystem"
    # 【中文】：对已知的一个目录做 ls（gitignore 感知）。不是工作区总览——总览用 repo_map，二者不要并行。
    description: "List one directory like ls (gitignore-aware). Not a workspace overview — that is repo_map. Do not pair the two."
    parameters:
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：要列出的那个目录（不是整仓）
        description: "Directory to list (one dir you already know, not the whole workspace)."
      depth:
        type: "integer"
        required: false
        default: 1
        # 【中文】：最大遍历深度。默认 1 = 本目录 + 直接子项。工作区树请用 repo_map。
        description: "Max recursion depth (default 1, max 6). Workspace tree → repo_map."

  - name: "glob"
    category: "filesystem"
    # 【中文】：按通配符模式查找匹配的文件。
    description: "Find files matching a glob pattern (e.g. `**/*.rs`)."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：通配符模式
        description: "Glob pattern to search for."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：搜索根目录
        description: "Root directory to search in."

  - name: "grep"
    category: "filesystem"
    # 【中文】：使用正则表达式在文件内容中搜索。
    description: "Search file contents across workspace with regex."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：搜索正则或关键词
        description: "Regex pattern or keyword to search for."
      path:
        type: "string"
        required: false
        # 【中文】：限定搜索的目录或文件
        description: "Subdirectory or file scope."
      glob:
        type: "string"
        required: false
        # 【中文】：文件过滤器（如 `*.rs`）
        description: "File filter pattern."
      case_insensitive:
        type: "boolean"
        required: false
        default: false
        # 【中文】：忽略大小写
        description: "Case-insensitive matching."

  - name: "open_file"
    category: "filesystem"
    # 【中文】：在系统 GUI 默认程序中打开或预览文件。
    description: "Open/preview a local file in default system GUI."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：文件路径
        description: "Path to open."

  - name: "bash"
    category: "system"
    # 【中文】：在终端执行命令。必须带 timeout：编译/测试/安装 900 秒，短命令 30 秒。
    description: "Run a shell command. ALWAYS pass timeout: 900 for compile/test/install (cargo/npm/make), 30 for short (git status, ls)."
    parameters:
      command:
        type: "string"
        required: true
        # 【中文】：命令行指令
        description: "Command string to run."
      timeout:
        type: "integer"
        required: true
        # 【中文】：秒。编译/测试/安装（cargo test、npm test、make）一律 900——链接可能几分钟无输出。短命令（git status、ls）30。禁止给 git status 传 900，禁止漏掉 cargo 的 timeout。
        description: "REQUIRED seconds. Compile/test/install: 900. Short (git status, ls): 30. Medium (git fetch): 120. GOOD: cargo test timeout=900. BAD: omit on cargo; BAD: 900 on git status."

  # ============================================================================
  # 二、代码智能核心 (Code Intelligence - 默认挂载)
  # ============================================================================
  - name: "repo_map"
    category: "codeintel"
    # 【中文】：生成索引支撑的完整代码库文件树与 AST 符号地图。
    description: "Generate complete, index-backed file tree and AST declaration map of the workspace."
    parameters:
      path:
        type: "string"
        required: false
        default: "."
        description: "Root path."
      max_depth:
        type: "integer"
        required: false
        default: 3
        description: "Max depth."

  - name: "code_explore"
    category: "codeintel"
    # 【中文核心工具】：全能代码探索与语义问答工具（核心主力工具，不仅用于架构探索！）。
    # 【使用技巧】：`path` 必须是目录/模块（crates/atomcode-coding、src/auth），禁止单个文件（那是 read_file）。
    # 在该目录下用 `query` 查精准符号名（CodeExploreTool）或自然中英文（鉴权怎么做 / how does X work）。
    # 例：path="crates/atomcode-coding" query="CodeExploreTool"；path="src/auth" query="用户登录如何校验"。
    # 工具会自动进行中英 NLP 语义分析、同义词扩展、AST 语法树调用链路追踪，并精准返回核心实现代码。
    description: "PRIMARY code-intelligence tool. path MUST be a directory/module (crates/atomcode-coding, src/auth), never a file. query is a precise symbol or natural Chinese/English."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：【必填】目录或模块（crates/atomcode-coding、src/auth）。禁止单个文件（src/auth.rs → read_file）。禁止 `.` / 工作区根（→ repo_map）。
        description: "REQUIRED directory or module (e.g. 'crates/atomcode-coding', 'src/auth'). NEVER a file ('src/auth.rs') — that is read_file. NEVER '.' — call repo_map first."
      query:
        type: "string"
        required: true
        # 【中文】：精准符号名（CodeExploreTool）或自然中英文（鉴权怎么做、how does session compaction work）。符号放 query，不要放 path。
        description: "Precise symbol name (CodeExploreTool) OR natural Chinese/English (鉴权怎么做, how does X work). Put the symbol here, not in path."
    guidance: "path is a directory/module after repo_map; query is a symbol or Chinese/English. Never pass a file as path. Never pass '.'."

  - name: "find_symbol"
    category: "codeintel"
    # 【中文】：查找符号的定义位置与类型签名。
    description: "Find symbol definition and signature by name."
    parameters:
      name:
        type: "string"
        required: true
        description: "Symbol name."
      path:
        type: "string"
        required: false
        description: "Path filter."

  # ============================================================================
  # 三、任务管理与交互 (Task & Interaction)
  # ============================================================================
  - name: "todowrite"
    category: "task"
    # 【中文】：管理结构化多步骤任务清单（待办/进行中/完成）。
    description: "Manage structured todo list (pending, in_progress, completed)."
    parameters:
      actions:
        type: "array"
        required: true
        # 【中文】：操作动作数组
        description: "Actions: add, update, delete, clear, insert. clear may share a batch with add/update (clear runs first). insert and delete stay in their own batches."

  - name: "request_user_input"
    category: "interaction"
    # 【中文】：向用户弹出交互式提问（单选/多选/文本）。
    description: "Ask user interactive questions (single/multiple choice or text)."
    parameters:
      questions:
        type: "array"
        required: true
        # 【中文】：提问列表
        description: "List of questions."

  - name: "memory"
    category: "memory"
    # 【中文】：跨会话记录重要事实或偏好。
    description: "Persist durable notes and preferences across sessions."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["remember", "forget", "list"]
      content:
        type: "string"
        required: false
        description: "Note content."

  - name: "recall"
    category: "memory"
    # 【中文】：检索历史会话的上下文与决策。
    description: "Recall past session conversation context."
    parameters:
      query:
        type: "string"
        required: true
        description: "Search keywords."

  - name: "task"
    category: "subagent"
    # 【中文】：派生子代理执行并行探索或代码修改。
    description: "Spawn an isolated subagent for parallel exploration or worker edits."
    parameters:
      subagent_type:
        type: "string"
        required: true
        enum: ["explore", "worker"]
      prompt:
        type: "string"
        required: true
        description: "Subagent instructions."
      files:
        type: "array"
        required: false
        description: "File scopes."

  - name: "code_review"
    category: "subagent"
    # 【中文】：运行代码评审子代理审查改动。
    description: "Run code review on staged or uncommitted changes."
    parameters:
      scope:
        type: "string"
        required: false
        description: "Review target."

  - name: "fetch_output"
    category: "utility"
    # 【中文】：取回之前被折叠的完整超长输出。
    description: "Fetch folded tool output by artifact ID."
    parameters:
      artifact_id:
        type: "string"
        required: true
        description: "Artifact ID."

  # ============================================================================
  # 四、网络与技能 (Web & Skills)
  # ============================================================================
  - name: "web_fetch"
    category: "web"
    # 【中文】：抓取网页并转为 Markdown。
    description: "Fetch webpage and convert to markdown."
    parameters:
      url:
        type: "string"
        required: true
        description: "URL to fetch."

  - name: "web_search"
    category: "web"
    # 【中文】：执行网络搜索。
    description: "Search the web for query."
    parameters:
      query:
        type: "string"
        required: true
        description: "Query string."

  - name: "use_skill"
    category: "skill"
    # 【中文】：执行已安装的指定技能。
    description: "Execute an installed skill by name."
    parameters:
      name:
        type: "string"
        required: true
        description: "Skill name from AVAILABLE SKILLS."

  - name: "list_skills"
    category: "skill"
    # 【中文】：列出已安装的全部技能。
    description: "List all installed skills."
    parameters: {}
